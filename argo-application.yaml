apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: expense-tracker

  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Srikantheggoju/expense-tracker-k8s.git
    targetRevision: HEAD
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: expense-tracker

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
